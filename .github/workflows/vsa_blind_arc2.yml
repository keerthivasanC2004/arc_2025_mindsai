name: vsa-blind-arc3
on:
  push:
    branches:
      - experiment/vsa-blind-arc3-20260825
  workflow_dispatch:
jobs:
  blind-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen upstream ARC-VSA and compatible SSP implementation
        run: |
          git clone https://github.com/ijoffe/ARC-VSA-2025.git /tmp/arcvsa
          cd /tmp/arcvsa
          git checkout c031a9c6b4885ab03b28fbfdcd97b6b3693df564
          git clone https://github.com/nsdumont/Semantic-Spiking-Neural-SLAM-2023.git /tmp/ssp-slam
          cd /tmp/ssp-slam
          git checkout 65307d1e1eebb82e37345bdd77acdcf9070b777f
          cp /tmp/ssp-slam/sspslam/sspspace.py /tmp/arcvsa/src/sspspace.py
          cd "$GITHUB_WORKSPACE"
          python experiments/patch_sspspace_even.py /tmp/arcvsa/src/sspspace.py
      - name: Install ARC-VSA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /tmp/arcvsa/requirements.txt
      - name: Verify exact 4096D SSP and ARC-VSA compatibility
        run: |
          PYTHONPATH=/tmp/arcvsa/src python - <<'PY'
          import numpy as np
          import sspspace
          space = sspspace.RandomSSPSpace(
              domain_dim=2,
              ssp_dim=4096,
              domain_bounds=np.array([[-15, 15], [-15, 15]]),
              length_scale=0.25,
              sampler='norm',
              rng=np.random.default_rng(0),
          )
          assert space.ssp_dim == 4096, space.ssp_dim
          enc = space.encode(np.array([[0.0, 0.0], [1.0, -1.0]]))
          assert enc.shape == (2, 4096), enc.shape
          sample_ssps, sample_pts = space.get_sample_pts_and_ssps(num_points_per_dim=3)
          assert sample_ssps.shape == (9, 4096), sample_ssps.shape
          assert sample_pts.shape == (9, 2), sample_pts.shape
          import vsa
          assert vsa.SSP_SPACE.ssp_dim == 4096, vsa.SSP_SPACE.ssp_dim
          centre = vsa.SSP_SPACE.encode(np.array([[0.0, 0.0]]))
          assert centre.shape == (1, 4096), centre.shape
          print('SSP_4096_COMPAT_OK', enc.shape, sample_ssps.shape, centre.shape)
          PY
      - name: Synthetic solver preflight before protected evaluation
        run: |
          PYTHONPATH=/tmp/arcvsa/src python - <<'PY'
          import types
          from objobj_solver import ObjObjSolver
          task = {
              'train': [
                  {'input': [[0,0,0],[0,1,0],[0,0,0]], 'output': [[0,0,0],[0,1,0],[0,0,0]]},
                  {'input': [[0,0,2],[0,0,0],[0,0,0]], 'output': [[0,0,2],[0,0,0],[0,0,0]]},
              ],
              'test': [
                  {'input': [[0,0,0],[3,0,0],[0,0,0]], 'output': [[0,0,0],[0,0,0],[0,0,0]]},
              ],
          }
          solver = ObjObjSolver(task)
          captured = {}
          def capture(self, train_gen_out_grids, test_gen_out_grids):
              captured['n_test'] = len(test_gen_out_grids)
              return 0.0, 0.0
          solver.print_results = types.MethodType(capture, solver)
          solver.solve_task()
          assert captured.get('n_test') == 1, captured
          print('SYNTHETIC_SOLVER_PREFLIGHT_OK')
          PY
      - name: Stage 1 - solve fresh protected tasks with dummy test outputs and freeze
        run: |
          python experiments/run_vsa_blind.py \
            --challenges data/arc-agi-2_evaluation_challenges.json \
            --arcvsa /tmp/arcvsa \
            --out vsa_blind_predictions.json | tee vsa_solver.log
          test -s vsa_blind_predictions.json
          test -s vsa_blind_predictions.json.sha256
      - name: Stage 2 - score frozen predictions
        run: |
          python experiments/score_vsa_blind.py \
            --predictions vsa_blind_predictions.json \
            --solutions data/arc-agi-2_evaluation_solutions.json | tee vsa_score.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vsa-blind-arc3-results
          path: |
            vsa_blind_predictions.json
            vsa_blind_predictions.json.sha256
            vsa_solver.log
            vsa_score.log
