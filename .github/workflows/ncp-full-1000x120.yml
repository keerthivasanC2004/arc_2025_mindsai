name: NCP full 1000x120

on:
  push:
    branches:
      - ncp-full-1000x120-20260913
    paths:
      - 'experiments/ncp_full_1000_120.py'
      - '.github/workflows/ncp-full-1000x120.yml'
  workflow_dispatch:

jobs:
  full-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Full 1000 training / 120 evaluation
        run: |
          python experiments/ncp_full_1000_120.py \
            --data-dir data \
            --out-dir ncp_full_results \
            --epochs 2 \
            --batch-size 16 \
            --adapt-steps 12 \
            --seed 260913

      - name: Print final report
        if: always()
        run: |
          if [ -f ncp_full_results/REPORT.md ]; then cat ncp_full_results/REPORT.md; fi
          if [ -f ncp_full_results/summary.json ]; then python -m json.tool ncp_full_results/summary.json | tail -n 120; fi

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncp-full-1000x120-results
          path: ncp_full_results/
          if-no-files-found: warn
          retention-days: 30
