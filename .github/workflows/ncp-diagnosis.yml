name: NCP failure diagnosis

on:
  push:
    branches:
      - ncp-diagnosis-20260913
    paths:
      - 'experiments/diagnose_ncp_failure.py'
      - '.github/workflows/ncp-diagnosis.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download prior full-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior
          gh run download 34778719339 -n ncp-full-1000x120-results -D prior
          find prior -maxdepth 3 -type f -print
      - name: Run diagnostics
        run: python experiments/diagnose_ncp_failure.py
      - name: Print diagnostics
        if: always()
        run: |
          if [ -f diagnostics/diagnostics.json ]; then cat diagnostics/diagnostics.json; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncp-failure-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
